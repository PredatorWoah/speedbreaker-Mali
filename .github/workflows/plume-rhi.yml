name: Plume shared Vulkan renderer
on:
  push:
    branches: ['android/plume-rhi']
  pull_request:
    paths: ['cmake/**', 'patches/plume/**', 'runtime/gpu/plume_backend.*', 'tests/plume/**', '.github/workflows/plume-rhi.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offscreen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install CPU Vulkan and shader validation tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev mesa-vulkan-drivers glslang-tools vulkan-validationlayers
      - name: Clean pinned Plume configure and build
        run: |
          cmake -S tests/plume -B build/plume-test -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/plume-test -j 4
      - name: Compare offscreen pixels, compute output, ownership and legacy fallback
        run: |
          for icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if [ -f "$icd" ]; then export VK_ICD_FILENAMES="$icd"; break; fi
          done
          ctest --test-dir build/plume-test --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plume-offscreen-validation
          path: build/plume-test/Testing/Temporary/LastTest.log
